[project]
name = "film-subtitles-mcp"
version = "0.1.1"
description = "把影片／音檔轉成逐字稿與繁體中文字幕的 MCP server（Groq Whisper + 可插拔翻譯後端）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # MCP 2.0 有破壞性變更（list_tools 行為變動），先釘在 1.x
    "mcp>=1.2,<2",
    # 中文音源要轉台灣繁體才送去校對
    "opencc-python-reimplemented>=0.1.7",
]

[project.scripts]
film-subtitles-mcp = "film_subtitles_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/film_subtitles_mcp"]
